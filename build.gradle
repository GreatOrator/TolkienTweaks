plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

def buildNum = project.hasProperty('currentBuildNumber') ? project.property('currentBuildNumber') : '0'
// The major.minor the whole build rides on: the jar's own version and the changelog headings the
// increment task writes both come from here, so the two can no longer drift apart.
def versionPrefix = "5.0"
project.ext.mod_version = "${versionPrefix}.${buildNum}"
version = project.ext.mod_version
group = mod_group_id

tasks.register("incrementBuildNumber") {
    group = "versioning"
    description = "Increments the app build number and logs to changelog"

    doLast {
        def propsFile = file("gradle.properties")
        if (propsFile.canRead()) {
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }

            // 1. Calculate the new numbers
            int oldBuild = (props.getProperty("currentBuildNumber") ?: "0").toInteger()
            int nextBuild = oldBuild + 1
            props.setProperty("currentBuildNumber", nextBuild.toString())
            propsFile.withWriter { props.store(it, "Auto-incremented by Gradle build") }

            // 2. Automate Local CHANGELOG tracking
            def changelogFile = file("CHANGELOG.md")
            if (changelogFile.exists()) {
                // Correct Java format pattern for YYYY-MM-DD (Note: Use uppercase MM and lowercase dd)
                def date = new java.text.SimpleDateFormat("yyyy-MM-dd").format(new Date())
                // The changelog is UTF-8 and holds an em dash: read and write it as UTF-8 so a
                // roll-up never re-encodes it into the platform charset.
                def oldContent = changelogFile.getText('UTF-8')

                // 💡 Prepends the entry with the full version: ## [5.0.X] - YYYY-MM-DD
                def newEntry = "## [${versionPrefix}.${nextBuild}] - ${date}\n* Structural mod updates and compilation builds\n\n"

                // Inject the entry right underneath the description banner header. The changelog is
                // stored with CRLF endings, so the insert follows whichever the file already uses -
                // a bare \n never matched and the entry was silently dropped.
                def banner = "All notable changes to this project will be documented in this file."
                if (!oldContent.contains(banner)) {
                    throw new GradleException("CHANGELOG.md is missing its banner header, so the entry was not written.")
                }
                def newline = oldContent.contains("\r\n") ? "\r\n" : "\n"
                def updatedContent = oldContent.replace(
                        banner + newline,
                        banner + newline + newline + newEntry.replace("\n", newline)
                )
                changelogFile.setText(updatedContent, 'UTF-8')
            }

            println "🚀 App version rolled up to: ${versionPrefix}.${nextBuild} (Local Changelog Tracked!)"
        } else {
            throw new GradleException("Could not read gradle.properties!")
        }
    }
}

repositories {
    // Mojang's own library repo: the NeoForm runtime pulls a few artifacts
    // (jtracy in particular) that the NeoForged mirror does not carry.
    maven { name = 'MojangLibraries'; url = 'https://libraries.minecraft.net' }
    mavenLocal()
    maven {
        name = 'TerraBlender'
        url = 'https://maven.minecraftforge.net'
        content { includeGroup 'com.github.glitchfiend' }
    }

    maven { //Patchouli && JEI
        url = 'https://maven.blamejared.com'
        content {
            includeGroup "mezz.jei"
            // JEI 29's runtime pulls mezz's own config library from the same repo; the API jars the
            // compile classpath needs do not, which is why only running the game hit this.
            includeGroup "net.mezzdev.config"
        }
    }
    maven {
        name = "TheIllusiveC4" //Curios
        url = uri("https://maven.theillusivec4.top/")
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            // GeckoLib 5 moved off software.bernie onto its own group.
            includeGroup("com.geckolib")
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // As of 26.1 vanilla is deobfuscated again and NeoForge's mappings carry the
    // official names, so no third-party mapping set is layered on top.

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse(project.mod_id + ',tolkienmobs_flight,tolkienmobs_mining,tolkienmobs_villages,tolkienmobs_coins,tolkienmobs_fellbeast')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse(project.mod_id + ',tolkienmobs_flight,tolkienmobs_mining,tolkienmobs_villages,tolkienmobs_coins,tolkienmobs_fellbeast')
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse(project.mod_id + ',tolkienmobs_flight,tolkienmobs_mining,tolkienmobs_villages,tolkienmobs_coins,tolkienmobs_fellbeast')
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}"
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    compileOnly "mezz.jei:jei-${jei_mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_mc_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${jei_mc_version}-neoforge:${jei_version}"

    implementation "top.theillusivec4.curios:curios-neoforge:${project.curios_version}+${project.minecraft_version}"

    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// The build number is bumped only when a distributable jar is produced, so that
// loading the game for testing (runClient, runServer, runData) never rewrites
// gradle.properties or CHANGELOG.md.
tasks.named('jar').configure {
    dependsOn incrementBuildNumber
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Temporary during the port: javac stops at 100 errors by default, which hides how
// much of the tree still needs work. The cap is a property because Gradle cannot
// carry more than a few thousand diagnostics back to the console - at 9,658 the
// daemon died with an OutOfMemoryError while serialising the report - so a run that
// goes further trades a clean summary for an unreadable one. Raise it with
// -PmaxCompileErrors=5000 if a wide sweep is ever worth the noise. Remove once the
// port lands.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', providers.gradleProperty('maxCompileErrors').getOrElse('1000')]
}
