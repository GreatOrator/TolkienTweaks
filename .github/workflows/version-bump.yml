name: Auto Release on Push

on:
  push:
    branches:
      - main

jobs:
  create-release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Dynamic Version String
        id: get_version
        run: |
          BUILD_NUM=$(grep 'currentBuildNumber=' gradle.properties | cut -d'=' -f2)
          FULL_VERSION="v4.3.${BUILD_NUM}"
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT

      # 📝 FIX: CRASH-PROOF LOGGING METHOD
      - name: Update Changelog File locally
        run: |
          TAG_NAME="${{ steps.get_version.outputs.version }}"
          CURRENT_DATE=$(date +'%Y-%m-%d')
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          # 1. Create the changelog file if it doesn't exist
          if [ ! -f CHANGELOG.md ]; then
            echo -e "# Changelog\n\nAll notable changes will be documented here.\n" > CHANGELOG.md
          fi
          
          # 2. Build the temporary new release entry 
          echo -e "## [$TAG_NAME] - $CURRENT_DATE\n" > new_entry.md
          echo -e "* $COMMIT_MSG" >> new_entry.md
          echo -e "\n" >> new_entry.md
          
          # 3. Read everything after the first two placeholder lines of the old changelog
          tail -n +3 CHANGELOG.md > historical_entries.md
          
          # 4. Safely reconstruct the file without relying on fragile slicing utilities
          echo -e "# Changelog\n" > CHANGELOG.md
          cat new_entry.md historical_entries.md >> CHANGELOG.md

      - name: Compile and Build Project
        run: |
          chmod +x gradlew
          ./gradlew build

      # 🚀 PUBLISH THE RELEASES AND ATTACH JAR ARTIFACTS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.get_version.outputs.version }}"
          
          # Deploy your build directly to GitHub Releases with your dynamic assets attached
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            build/libs/*.jar \
            CHANGELOG.md