name: Auto Release on Push

on:
  push:
    branches:
      - main

jobs:
  create-release:
    # This job only runs if your last commit message contains "[release]"
    if: contains(github.event.head_commit.message, '[release]')

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 💡 Crucial: Pulls all commit history so GitHub can auto-build the changelog

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21' # 💡 Match your local Java version (e.g., '17', '21')
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Dynamic Version String
        id: get_version
        run: |
          BUILD_NUM=$(grep 'currentBuildNumber=' gradle.properties | cut -d'=' -f2)
          FULL_VERSION="v4.3.${BUILD_NUM}"
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Compile and Build Project
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Configure Git Credentials
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # 📝 AUTOMATICALLY GENERATE CHANGELOG TEXT AND WRITE IT TO CHANGELOG.MD
      - name: Update Changelog File
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.get_version.outputs.version }}"
          CURRENT_DATE=$(date +'%Y-%m-%d')
          
          # 1. Ask GitHub's API to build a markdown string of all new commits/PRs
          gh rpc POST /repos/{owner}/{repo}/releases/generate-notes -f tag_name="$TAG_NAME" > raw_notes.json
          jq -r '.body' raw_notes.json > clean_notes.md
          
          # 2. Build the new entry text block
          echo -e "## [$TAG_NAME] - $CURRENT_DATE\n" > new_entry.md
          cat clean_notes.md >> new_entry.md
          echo -e "\n" >> new_entry.md
          
          # 3. Inject the entry smoothly underneath the main "# Changelog" heading block
          sed -i '/# Changelog/r new_entry.md' CHANGELOG.md
          
          # 4. Commit the newly updated CHANGELOG.md file back into your codebase
          git add CHANGELOG.md
          git commit -m "docs: automatic changelog update for $TAG_NAME [skip ci]"
          git push origin main

      # 🚀 CREATE THE GITHUB TAG AND PUBLISH THE ENTIRE RELEASE WITH YOUR JAR ARTIFACT
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.get_version.outputs.version }}"
          
          # Build the release directly via GitHub CLI and attach any built jar file
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            build/libs/*.jar