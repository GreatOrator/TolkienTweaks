name: Auto Release on Push

on:
  push:
    branches:
      - main

jobs:
  create-release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants full permissions to publish the tag and release assets

    steps:
      - name: Checkout Repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessary for generating release notes from history

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Match your local Java version
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Dynamic Version String
        id: get_version
        run: |
          BUILD_NUM=$(grep 'currentBuildNumber=' gradle.properties | cut -d'=' -f2)
          FULL_VERSION="v4.3.${BUILD_NUM}"
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT

      # 📝 GENERATE CHANGELOG LOCALLY (WITHOUT PUSHING TO REPO BRANCH)
      - name: Update Changelog File locally
        run: |
          TAG_NAME="${{ steps.get_version.outputs.version }}"
          CURRENT_DATE=$(date +'%Y-%m-%d')
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          # Build a temporary markdown section 
          echo -e "## [$TAG_NAME] - $CURRENT_DATE\n" > new_entry.md
          echo -e "* $COMMIT_MSG" >> new_entry.md
          echo -e "\n" >> new_entry.md
          
          # Inject it into your local workspace's CHANGELOG.md file
          sed -i '/# Changelog/r new_entry.md' CHANGELOG.md

      # 🛠️ COMPILE THE PROJECT (Now includes the fresh CHANGELOG file automatically inside the build folder)
      - name: Compile and Build Project
        run: |
          chmod +x gradlew
          ./gradlew build

      # 🚀 CREATE THE RELEASES AND ATTACH JAR ARTIFACTS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.get_version.outputs.version }}"
          
          # Create the formal tag, compile release notes, and deploy built assets safely
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            build/libs/*.jar \
            CHANGELOG.md