name: Auto Increment Version on Push

on:
  push:
    branches:
      - main  # or master

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the runner to push changes back to your repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Match your project's Java version
        distribution: 'temurin'

    - name: Run Increment Task
      run: ./gradlew incrementBuildNumber

    - name: Commit and Push Updated Version
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add gradle.properties
        git commit -m "chore: auto-increment build counter [skip ci]"
        git push